[package]
name = "easykeeper"
version = "0.1.0"
description = "EasyKeeper desktop application"
edition = "2024"
rust-version = "1.90"

[lib]
name = "easykeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[features]
default = []
# Explicitly enable WKPreferences.javaScriptCanOpenWindowsAutomatically on macOS
# (needed to restore pop-outs on startup without a user gesture, if WebKit defaults to NO).
mac-auto-popups = ["dep:objc2-web-kit"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
rusqlite = { version = "0.37.0", features = ["bundled", "hooks", "backup"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks"] }
tokio = { version = "1", features = ["macros", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel"] }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences"] }
