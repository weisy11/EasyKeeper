[package]
name = "easykeeper"
version = "0.1.0"
description = "EasyKeeper desktop application"
edition = "2024"
rust-version = "1.90"

[lib]
name = "easykeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[features]
default = []
# Explicitly enable WKPreferences.javaScriptCanOpenWindowsAutomatically on macOS
# (needed to restore pop-outs on startup without a user gesture, if WebKit defaults to NO).
mac-auto-popups = ["dep:objc2-web-kit"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
rusqlite = { version = "0.37.0", features = ["bundled", "hooks", "backup"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", optional = true, features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences"] }
